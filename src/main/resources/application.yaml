spring:
  application:
    name: converter

  datasource:
    url: jdbc:postgresql://localhost:5432/converter
    username: converter
    password: converter
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: converter-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.example.converter.dto.ConversionRequestEvent
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  source-bucket: source-files
  result-bucket: converted-files

kafka:
  topics:
    conversion-request: conversion-request
    conversion-result: conversion-result

inbox:
  scheduler:
    fixed-delay-ms: 5000
